<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            position: fixed !important;
            top: 0;
            left: 0;
        }

        /* Target the canvas generated by A-Frame */
        .a-canvas {
            width: 100vw !important;
            height: 100vh !important;
            top: 0 !important;
            left: 0 !important;
        }

        /* Target the AR.js webcam video feed */
        video#arjs-video, .a-scene video {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            margin: 0 !important;
        }

        #change-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background-color: #FF5733;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="change-btn" onclick="goToIndex()">Change Function</button>
    
    <!-- Explicit source dimensions prevent AR.js from collapsing to a distorted 640x480 crop -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; sourceWidth:1280; sourceHeight:960; displayWidth:1280; displayHeight:960;" 
        vr-mode-ui="enabled: false">
        
        <a-camera position="0 1.6 0"></a-camera>

        <a-entity id="graph-container" position="0 -1.2 -5" rotation="-75 0 0">
            <a-plane 
                id="matplotlib-graph" 
                width="3" 
                height="3" 
                rotation="-75 0 0"
                material="transparent: true; alphaTest: 0.5;">
            </a-plane>
        </a-entity>
        
    </a-scene>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const filename = urlParams.get('filename');

        // MutationObserver catches the video element the instant AR.js injects it into the DOM
        const observer = new MutationObserver(() => {
            const video = document.querySelector('#arjs-video') || document.querySelector('video');
            if (video) {
                video.style.setProperty('width', '100vw', 'important');
                video.style.setProperty('height', '100vh', 'important');
                video.style.setProperty('object-fit', 'cover', 'important');
                video.style.setProperty('margin-left', '0px', 'important');
                video.style.setProperty('margin-top', '0px', 'important');
            }
        });

        observer.observe(document.body, { childList: true, subtree: true });

        window.addEventListener('DOMContentLoaded', () => {
            const graphPlane = document.querySelector('#matplotlib-graph');

            if (filename) {
                const imageUrl = `/plots/${filename}`;
                graphPlane.setAttribute('material', `src: url(${imageUrl}); transparent: true; alphaTest: 0.5;`);
                console.log(`Loading image from: ${imageUrl}`);
            } else {
                console.error("No filename parameter provided in the URL.");
            }
        });

        function goToIndex() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
