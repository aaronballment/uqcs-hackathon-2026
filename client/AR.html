<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Include AR.js for the camera background feed -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #change-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background-color: #FF5733;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        #change-btn:active {
            transform: translateX(-50%) scale(0.95);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">
    <button id="change-btn" onclick="goToIndex()">Change Function</button>
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        
        <a-camera position="0 1.6 0"></a-camera>

        <!-- CONTAINER WRAPPER: This anchors items in world space so they stay sticky -->
        <a-entity id="graph-container" position="0 -1.2 -5" rotation="-75 0 0">
            <!-- Matplotlib Graph Plane nested securely inside the sticky container -->
            <a-plane 
                id="matplotlib-graph" 
                width="3" 
                height="3" 
                material="transparent: true; alphaTest: 0.5;">
            </a-plane>
        </a-entity>
        
    </a-scene>

    <script>
                // Extract 'filename' from the URL query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const filename = urlParams.get('filename');

        window.addEventListener('DOMContentLoaded', () => {
            const graphPlane = document.querySelector('#matplotlib-graph');

            if (filename) {
                // Construct the relative URL pointing to FastAPI's mounted /plots directory
                const imageUrl = `/plots/${filename}`;
                
                // Update the A-Frame plane material with the image URL
                graphPlane.setAttribute('material', `src: url(${imageUrl}); transparent: true; alphaTest: 0.5;`);
                console.log(`Loading image from: ${imageUrl}`);
            } else {
                console.error("No filename parameter provided in the URL.");
            }
        });

        function goToIndex() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
