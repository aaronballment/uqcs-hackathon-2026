<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script>
        AFRAME.registerComponent('smooth-follow', {
            schema: {
                distance: { type: 'number', default: 6.0 }, // Pushed back further
                yOffset:  { type: 'number', default: 0.35 }, // Lifted higher
                speed:    { type: 'number', default: 0.05 },
                enableRotationFollow: { type: 'boolean', default: true }
            },
            init: function () {
                this.targetPos = new THREE.Vector3();
                this.camPos = new THREE.Vector3();
                this.camDir = new THREE.Vector3();
                this.camQuat = new THREE.Quaternion();
                this.scale = new THREE.Vector3();
            },
            tick: function () {
                const scene = this.el.sceneEl;
                if (!scene || !scene.camera) return;

                const cameraThree = scene.camera;

                // Extract position, rotation, and direction directly from camera matrix
                cameraThree.matrixWorld.decompose(this.camPos, this.camQuat, this.scale);
                this.camDir.set(0, 0, -1).applyQuaternion(this.camQuat);

                // Target coordinate calculation
                this.targetPos.copy(this.camPos).addScaledVector(this.camDir, this.data.distance);
                this.targetPos.y += this.data.yOffset;

                // Smooth linear interpolation (glide effect)
                this.el.object3D.position.lerp(this.targetPos, this.data.speed);

                // Smooth spherical linear interpolation (rotational lag)
                if (this.data.enableRotationFollow) {
                    this.el.object3D.quaternion.slerp(this.camQuat, this.data.speed);
                }
            }
        });

        AFRAME.registerComponent('double-sided', {
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const obj3D = this.el.getObject3D('mesh');
                    if (obj3D) {
                        obj3D.traverse((node) => {
                            if (node.isMesh) {
                                node.material.side = THREE.DoubleSide;
                                node.material.needsUpdate = true;
                            }
                        });
                    }
                });
            }
        });
    </script>

    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            position: fixed !important;
            top: 0; left: 0;
            touch-action: none;
        }

        .a-canvas {
            width: 100vw !important;
            height: 100vh !important;
            top: 0 !important; left: 0 !important;
        }

        video#arjs-video, .a-scene video {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            margin: 0 !important;
        }

        #change-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background-color: #FF5733;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="change-btn" onclick="goToIndex()">Change Function</button>
    
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; sourceWidth:1280; sourceHeight:960; displayWidth:1280; displayHeight:960;" 
        vr-mode-ui="enabled: false">
        
        <a-entity light="type: ambient; color: #ffffff; intensity: 1.8;"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 1.2;" position="1 4 2"></a-entity>

        <a-camera position="0 1.6 0"></a-camera>

        <a-entity id="graph-container" smooth-follow="distance: 6.0; yOffset: 0.35; speed: 0.07; enableRotationFollow: true"></a-entity>
        
    </a-scene>

    <script>
        let is3D = false;
        let touchStartX = 0;
        let touchStartY = 0;
        let initialPinchDist = null;
        let currentScale = 1.0;

        const observer = new MutationObserver(() => {
            const video = document.querySelector('#arjs-video') || document.querySelector('video');
            if (video) {
                video.style.setProperty('width', '100vw', 'important');
                video.style.setProperty('height', '100vh', 'important');
                video.style.setProperty('object-fit', 'cover', 'important');
                video.style.setProperty('margin-left', '0px', 'important');
                video.style.setProperty('margin-top', '0px', 'important');
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const filename = urlParams.get('filename');
            const container = document.querySelector('#graph-container');

            if (!filename) {
                console.error("No filename provided in URL parameters.");
                return;
            }

            const fileUrl = `/plots/${filename}`;

            if (filename.endsWith('.glb')) {
                is3D = true;
                container.setAttribute('smooth-follow', 'distance: 5.5; yOffset: 0.35; speed: 0.05; enableRotationFollow: false');
                
                const modelEntity = document.createElement('a-entity');
                modelEntity.setAttribute('double-sided', '');
                modelEntity.setAttribute('gltf-model', fileUrl);
                modelEntity.setAttribute('scale', '1.2 1.2 1.2');
                modelEntity.setAttribute('rotation', '-18 35 0');
                
                container.appendChild(modelEntity);
            } else {
                is3D = false;
                container.setAttribute('smooth-follow', 'distance: 4.0; yOffset: 0.35; speed: 0.05; enableRotationFollow: true');
                
                const plane = document.createElement('a-plane');
                plane.setAttribute('width', '2.8');
                plane.setAttribute('height', '2.8');
                plane.setAttribute('rotation', '-18 0 0');
                plane.setAttribute('material', `src: url(${fileUrl}); transparent: true; alphaTest: 0.5; shader: flat; side: double;`);
                
                container.appendChild(plane);
            }
        });

        document.body.addEventListener('touchstart', (e) => {
            if (!is3D) return;
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].pageX;
                touchStartY = e.touches[0].pageY;
            } else if (e.touches.length === 2) {
                initialPinchDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        });

        document.body.addEventListener('touchmove', (e) => {
            if (!is3D) return;
            const container = document.querySelector('#graph-container');
            const meshEntity = container.children[0];
            if (!meshEntity) return;

            if (e.touches.length === 1) {
                const deltaX = e.touches[0].pageX - touchStartX;
                const deltaY = e.touches[0].pageY - touchStartY;

                const rot = meshEntity.getAttribute('rotation') || { x: -18, y: 35, z: 0 };
                meshEntity.setAttribute('rotation', {
                    x: rot.x + deltaY * 0.4,
                    y: rot.y + deltaX * 0.4,
                    z: rot.z
                });

                touchStartX = e.touches[0].pageX;
                touchStartY = e.touches[0].pageY;
            } else if (e.touches.length === 2 && initialPinchDist) {
                const currentDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                const diff = currentDist - initialPinchDist;
                currentScale = Math.max(0.3, Math.min(4.0, currentScale + diff * 0.003));
                
                meshEntity.setAttribute('scale', `${1.2 * currentScale} ${1.2 * currentScale} ${1.2 * currentScale}`);
                initialPinchDist = currentDist;
            }
        });

        document.body.addEventListener('touchend', () => {
            initialPinchDist = null;
        });

        function goToIndex() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
