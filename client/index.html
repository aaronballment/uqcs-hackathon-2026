<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Graphs</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="camera-container" id="camera-container">
    <!-- Camera Video Feed -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Header Overlay -->
    <header class="top-bar">
      <button class="close-btn hidden" id="close-btn" aria-label="Cancel and retake">&#10005;</button>
      <h1>AR Graphs</h1>
    </header>

    <!-- Floating Top-Left Domain Controls -->
    <div class="domain-controls" id="domain-controls">
      <!-- Min X Chip & Popup Slider -->
      <div class="domain-chip-wrapper">
        <div class="domain-input-chip" id="chip-min">
          <label>Min X</label>
          <span class="chip-val" id="val-min">-10</span>
        </div>
        <div class="slider-popup hidden" id="popup-min">
          <input type="range" id="slider-min" min="-50" max="0" value="-10" step="1">
        </div>
      </div>

      <!-- Max X Chip & Popup Slider -->
      <div class="domain-chip-wrapper">
        <div class="domain-input-chip" id="chip-max">
          <label>Max X</label>
          <span class="chip-val" id="val-max">10</span>
        </div>
        <div class="slider-popup hidden" id="popup-max">
          <input type="range" id="slider-max" min="1" max="50" value="10" step="1">
        </div>
      </div>
    </div>

    <!-- Loading Screen Overlay -->
    <div class="loading-overlay hidden" id="loading-overlay">
      <div class="spinner"></div>
      <p>Extracting equation & generating 3D plot...</p>
    </div>

    <!-- Shutter Button Overlay -->
    <div class="bottom-bar" id="bottom-bar">
      <button class="shutter-btn" id="capture-btn" aria-label="Take Photo">
        <div class="shutter-btn-inner"></div>
      </button>
    </div>
  </div>

  <div id="ar-viewport" class="hidden"></div>

  <script src="app.js"></script>
</body>
</html>
