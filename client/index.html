<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Graphs</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="camera-container" id="camera-container">
    <!-- Camera Video Feed -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Header Overlay -->
    <header class="top-bar">
      <button class="close-btn hidden" id="close-btn" aria-label="Cancel and retake">&#10005;</button>
      <h1>AR Graphs</h1>
    </header>

    <!-- Floating Top-Left Domain Controls -->
    <div class="domain-controls" id="domain-controls">
      <div class="domain-input-chip">
        <label for="x-min">Min X</label>
        <input type="number" id="x-min" value="-10" step="any">
      </div>
      <div class="domain-input-chip">
        <label for="x-max">Max X</label>
        <input type="number" id="x-max" value="10" step="any">
      </div>
    </div>

    <!-- Loading Screen Overlay -->
    <div class="loading-overlay hidden" id="loading-overlay">
      <div class="spinner"></div>
      <p>Extracting equation & generating 3D plot...</p>
    </div>

    <!-- Shutter Button Overlay -->
    <div class="bottom-bar" id="bottom-bar">
      <button class="shutter-btn" id="capture-btn" aria-label="Take Photo">
        <div class="shutter-btn-inner"></div>
      </button>
    </div>
  </div>

  <!-- Container where AR Scene will be mounted dynamically -->
  <div id="ar-viewport" class="hidden"></div>

  <script src="app.js"></script>
</body>
</html>
