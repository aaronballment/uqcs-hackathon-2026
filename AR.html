<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" 
             renderer="logarithmicDepthBuffer: true;"
             vr-mode-ui="enabled: false">
        
        <!-- The Hiro marker acts as the physical anchor -->
        <a-marker preset="hiro">
            
            <!-- The graph is now pinned to the marker, not the camera -->
            <!-- We rotate it -90 on X so it sits flat like a sheet of paper on the marker -->
            <a-plane 
                id="matplotlib-graph" 
                position="0 0.1 0" 
                rotation="-90 0 0" 
                width="2" 
                height="2" 
                material="transparent: true; alphaTest: 0.5;">
            </a-plane>

        </a-marker>
        
        <!-- Camera is just a passive observer now -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const BACKEND_URL = "https://your-ngrok-subdomain.ngrok-free.app";

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(`${BACKEND_URL}/get-graph?t=${Date.now()}`);
                if (!response.ok) throw new Error("Failed to fetch");

                const imageBlob = await response.blob();
                const imageObjectURL = URL.createObjectURL(imageBlob);

                const graphPlane = document.querySelector('#matplotlib-graph');
                graphPlane.setAttribute('material', `src: url(${imageObjectURL}); transparent: true; alphaTest: 0.5;`);
            } catch (error) {
                console.error("Error loading graph:", error);
            }
        });
    </script>
</body>
</html>
